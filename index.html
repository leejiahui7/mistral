<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lee Jia Hui</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root{
  --cream:#f7f2ea;
  --ink:#111827;
  --muted:#6b7280;
  --gold:#c8943f;
  --orange:#ff5a00;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(circle at top,#fffaf2 0%,var(--cream) 55%,#efe7da 100%);
  color:var(--ink);
  font-family:Inter,system-ui,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.card{
  width:100%;
  max-width:430px;
  text-align:center;
  padding:34px 22px 30px;
}

.photo{
  width:min(78vw,310px);
  height:min(78vw,310px);
  object-fit:cover;
  border-radius:999px;
  box-shadow:0 24px 70px rgba(17,24,39,.16);
  border:1px solid rgba(255,255,255,.8);
}

h1{
  font-family:"Cormorant Garamond",serif;
  font-size:54px;
  font-weight:600;
  line-height:1;
  margin:34px 0 12px;
  letter-spacing:-.03em;
}

.role{
  font-size:12px;
  letter-spacing:.14em;
  text-transform:uppercase;
  line-height:1.7;
  color:var(--muted);
  max-width:330px;
  margin:0 auto;
}

.location{
  margin-top:12px;
  font-size:14px;
  color:var(--ink);
}

.email{
  margin-top:28px;
  font-size:16px;
}

.email a{
  color:var(--ink);
  text-decoration:none;
  border-bottom:1px solid var(--gold);
  padding-bottom:3px;
}

.quote{
  margin-top:44px;
  font-family:"Cormorant Garamond",serif;
  font-size:38px;
  font-style:italic;
  color:var(--ink);
}

.mark{
  width:34px;
  height:2px;
  background:var(--orange);
  margin:26px auto 0;
  border-radius:99px;
}

@media(max-width:390px){
  h1{font-size:46px}
  .quote{font-size:32px}
  .card{padding-top:20px}
}
</style>
</head>

<body>
  <main class="card">
    <img src="profile-cat.png" alt="Lee Jia Hui with Mistral AI cat" class="photo">

    <h1>Lee Jia Hui</h1>

    <div class="role">
      Strategic Communications · AI Policy · Public Sector Technology
    </div>

    <div class="location">Singapore</div>

    <div class="email">
      <a href="mailto:leejiahui7@gmail.com">leejiahui7@gmail.com</a>
    </div>

    <div class="quote">« Pourquoi pas ? »</div>
    <div class="mark"></div>
  </main>
</body>
</html>
